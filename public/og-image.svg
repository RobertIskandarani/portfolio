<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Portfolio de Robert Iskandarani">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-glow2" cx="10%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>
  <rect width="1200" height="630" fill="url(#og-glow2)"/>
  <g transform="translate(80, 200)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="92" fill="#ffffff" letter-spacing="-3">Robert Iskandarani</text>
    <text x="0" y="80" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="44" fill="#38bdf8">Ingeniero Informático</text>
    <text x="0" y="140" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="36" fill="rgba(255,255,255,0.78)">FullStack Developer · COO @ Yuppie</text>
    <text x="0" y="230" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="26" fill="rgba(255,255,255,0.5)">React · TypeScript · Astro · Node.js · IA aplicada</text>
  </g>
  <g transform="translate(80, 540)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="22" fill="rgba(255,255,255,0.6)">robertiskandarani.com</text>
  </g>
  <g transform="translate(950, 100)" opacity="0.85">
    <circle cx="0" cy="0" r="160" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(56,189,248,0.18)" stroke-width="1"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="rgba(56,189,248,0.12)" stroke-width="1"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="rgba(56,189,248,0.08)" stroke-width="1"/>
    <circle cx="160" cy="0" r="14" fill="#38bdf8"/>
    <circle cx="-120" cy="0" r="10" fill="#a78bfa"/>
    <circle cx="0" cy="80" r="8" fill="#f472b6"/>
  </g>
